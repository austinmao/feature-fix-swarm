name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run python test suites
        run: |
          python -m pip install --quiet pytest
          python -m pytest lib/ tests/ -q
      - name: SKILL.md verify blocks (anti-rot)
        run: python scripts/verify-skill-blocks.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck shell surface
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          # warning level: the repo's heredoc-heavy SKILL snippets live in md
          # (not linted); this covers the executable shell surface.
          shellcheck -S warning setup.sh hooks/*.sh scripts/*.sh scripts/hooks/*.sh scripts/gsd/*.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bats suites
        env:
          # This IS the packaged repo — there is no consumer-installed copy of the
          # levers to drift from, so FALLBACK-017's fail-closed drift check has
          # nothing to compare. It stays live in consumer repos (openclaw), where
          # an absent installed copy is a real finding.
          GSD_FFS_STANDALONE: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bats
          # discover every suite (the real coverage lives at
          # scripts/harness/ruflo-host-executor.bats, not tests/bats/)
          mapfile -t SUITES < <(find . -name '*.bats' -not -path './.git/*')
          if [ "${#SUITES[@]}" -eq 0 ]; then
            echo "no bats suites found"; exit 0
          fi
          bats "${SUITES[@]}"
