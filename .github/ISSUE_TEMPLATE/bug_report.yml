name: Bug report
description: Report a reproducible problem in Feature Fix Swarm
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove credentials and private repository content before submitting. Security vulnerabilities belong in the private reporting flow linked below.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and release notes.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    attributes:
      label: FFS version or commit
      placeholder: v5.0.5 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Host
      options:
        - Codex CLI
        - Claude Code
        - Both
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Operating system, shell, Python, Node/npm, and Codex/Claude versions.
      placeholder: macOS 15, zsh, Python 3.11, Node 22, Codex 0.146.x
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation scope
      options:
        - Project
        - User
        - Not installed / source checkout
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Run …
        2. Observe …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and sanitized output
      description: Include doctor output or logs only after removing secrets and private data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Links, minimal public fixtures, or suspected regression range.
