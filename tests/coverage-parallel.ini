[run]
branch = True
parallel = True
concurrency = multiprocessing
patch = subprocess
# The private copy drops compiled extensions on purpose (cross_interpreter.py),
# so interpreters without sysmon fall back to the Python tracer. Coverage still
# warns about that on stderr, which breaks stderr-sensitive tests in children.
disable_warnings =
    no-ctracer
source =
    .
omit =
    tests/*
    */tests/*
    vendor/*
    */vendor/*
    .staging/*
    */.staging/*
    node_modules/*
    */node_modules/*
    */__pycache__/*

[report]
include_namespace_packages = True
omit =
    tests/*
    */tests/*
    vendor/*
    */vendor/*
    .staging/*
    */.staging/*
    node_modules/*
    */node_modules/*
    */__pycache__/*
show_missing = True
skip_empty = True

[xml]
output = coverage.xml
