[run]
branch = True
parallel = True
concurrency = multiprocessing
patch = subprocess
source =
    .
omit =
    tests/*
    */tests/*
    vendor/*
    */vendor/*
    .staging/*
    */.staging/*
    X/*
    */X/*
    node_modules/*
    */node_modules/*
    */__pycache__/*

[report]
include_namespace_packages = True
omit =
    tests/*
    */tests/*
    vendor/*
    */vendor/*
    .staging/*
    */.staging/*
    X/*
    */X/*
    node_modules/*
    */node_modules/*
    */__pycache__/*
show_missing = True
skip_empty = True

[xml]
output = coverage.xml
