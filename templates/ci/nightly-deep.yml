# ffs template: nightly-deep (REQ-301). Rendered by env-registry.sh render
# (03-02). A nightly failure opens an issue instead of reddening the default
# branch; the issue job escalates at JOB level only (Pitfall 8).
name: nightly-deep

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffs-nightly-deep-${{ github.ref }}

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # CONSUMER SETUP — dependency install belongs in your rendered copy;
      # the tier registry stays the only source of test commands.
      - name: Run nightly tier
        run: bash scripts/gsd/test-tier.sh {{TIER_NIGHTLY}} > "$RUNNER_TEMP/tier-cmds" && bash -e "$RUNNER_TEMP/tier-cmds"
  file-issue:
    needs: deep
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # wall 7f08ccda: job-level permissions REPLACE the workflow-level block,
    # so contents: read is restated alongside the issues escalation.
    permissions:
      contents: read
      issues: write
    steps:
      # wall af9f57b1: expression values cross into shell via env: only.
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh issue create --repo "$REPO" --title "nightly-deep tier failed" --body "Nightly deep tier failed. Run: $RUN_URL"
          else
            echo "gh CLI unavailable; skipping issue creation" >&2
          fi
